<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EncoreAI</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="taskpane.js"></script>
</head>
<body class="ms-font-m ms-welcome ms-Fabric">
    <main id="app-body" style="display: none; flex-direction: column;">
        <div class="tab-buttons">
            <button class="tab-button active" id="tab-gemini">Gemini</button>
            <button class="tab-button" id="tab-chatgpt">ChatGPT</button>
        </div>

        <div class="info-container">
            <p id="status" class="status-text">Ready</p>
            <p id="key-status" style="font-size: 10px; color: green; margin: 0; height: 12px;"></p>
            
            <div id="settings-gemini" class="settings-group">
                <div class="key-input-group">
                    <input type="password" id="gemini-key-input" placeholder="Gemini API Key">
                    <button id="save-gemini-btn">Save Gemini Key</button>
                </div>
            </div>

            <div id="settings-chatgpt" class="settings-group" style="display: none;">
                <div class="key-input-group">
                    <input type="password" id="chatgpt-key-input" placeholder="ChatGPT API Key">
                    <button id="save-chatgpt-btn">Save ChatGPT Key</button>
                </div>
            </div>
        </div>

        <button id="run" class="ms-Button ms-Button--primary">
            <span class="ms-Button-label">Analyze Email</span>
        </button>

        <div id="suggestion-container">
            <div id="content-gemini" class="tab-content">
                <div id="suggestion-gemini" class="suggestion-box">Gemini output will appear here...</div>
            </div>
            <div id="content-chatgpt" class="tab-content" style="display: none;">
                <div id="suggestion-chatgpt" class="suggestion-box">ChatGPT output will appear here...</div>
            </div>
        </div>

        <button id="insert-btn" class="ms-Button" style="display: none;">
            <span class="ms-Button-label">Insert into Reply</span>
        </button>
    </main>
</body>
</html>
